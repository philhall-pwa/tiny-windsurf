<body>
<style>
/* Layout: full-bleed pixel canvas (the sea), DOM HUD + menus on top. One committed look: 16-bit tour broadcast. */
:root{
  --ink:#0d2236; --panel:#123a5a; --panel-hi:#1b5482; --line:#6fd4e4; --text:#f6fbf4; --dim:#9fd2e2;
  --orange:#ff7a2e; --orange-dk:#b8461a; --gold:#ffd23f; --silver:#d8e4ec; --bronze:#e09a5a; --lime:#9ae82a; --red:#ff5a5a;
  --font:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--ink)}
#view{position:absolute;image-rendering:pixelated}
#touch{position:absolute;inset:0;touch-action:none}
.panel{background:rgba(13,34,54,.84);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--line);padding:6px 8px;line-height:1.2;font-size:11px;letter-spacing:.04em}
.big{font-size:18px;font-weight:700;letter-spacing:.02em}
.big small{font-size:10px;color:var(--dim);margin-left:2px}
.dim{color:var(--dim)}
#hud{position:absolute;inset:0;pointer-events:none}
#tl{position:absolute;left:12px;top:12px;min-width:84px}
#tr{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#mini{width:80px;height:96px;image-rendering:pixelated;background:rgba(13,34,54,.84);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--line)}
#windTxt{text-align:right;font-size:10px}
#shiftTxt{font-weight:700}
#tc{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
.chip{font:700 10px var(--font);color:var(--text);background:rgba(13,34,54,.84);border:0;padding:7px 9px;cursor:pointer;letter-spacing:.06em;
  box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--line)}
.chip:focus-visible,.cta:focus-visible,.ghost:focus-visible,.lvl:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px;gap:8px}
#dash{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 10px 8px}
#delta{height:13px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
#spdRow{display:flex;align-items:baseline;gap:5px}
#spd{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.unit{font-size:11px;color:var(--dim)}
.bars{display:grid;gap:4px;width:152px}
.bar{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;font-size:9px;color:var(--dim);letter-spacing:.06em}
.track{height:6px;background:#0a1c2c;box-shadow:0 0 0 1px #2a5a7a}
.track i{display:block;height:100%;width:0}
#flowBar{background:var(--gold)}
#ctrlBar{background:var(--lime)}
#ctrlBar.warn{background:var(--red);animation:blink .3s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#polar{width:160px;height:36px;image-rendering:pixelated}
#gtxt{font-size:9px;letter-spacing:.05em;color:var(--dim)}
.arr{width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;opacity:.25;margin-bottom:30px}
.arr.l{border-right:26px solid var(--text)}
.arr.r{border-left:26px solid var(--text)}
#toast{position:absolute;left:0;right:0;top:31%;text-align:center;font-weight:700;font-size:15px;text-shadow:2px 2px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .15s;padding:0 16px}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:17%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 16px}
#banner.on{opacity:1}
#banner b{display:block;font-size:24px;color:var(--text);text-shadow:3px 3px 0 var(--orange-dk);letter-spacing:.04em}
#banner span{display:inline-block;margin-top:6px;font-size:10px;color:var(--gold);letter-spacing:.08em;background:rgba(13,34,54,.8);padding:4px 8px}
#cd{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:700;font-size:72px;color:var(--text);text-shadow:4px 4px 0 var(--orange-dk);pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(8,26,44,.5);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
.card{width:100%;max-width:360px;margin:auto 0;background:var(--panel);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--line),8px 8px 0 6px rgba(8,26,44,.5);padding:18px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:34px;line-height:.95;font-weight:700;color:var(--text);text-shadow:3px 3px 0 var(--orange-dk);letter-spacing:.02em;text-wrap:balance}
h2{margin:0 0 4px;font-size:22px;font-weight:700;color:var(--text);text-shadow:3px 3px 0 var(--orange-dk)}
.sub{margin:0 0 14px;color:var(--gold);font-size:11px;letter-spacing:.08em}
.levels{display:grid;gap:8px;margin:0 0 14px}
.lvl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--text);
  background:var(--panel-hi);border:0;padding:9px 10px;cursor:pointer;box-shadow:0 3px 0 #0b2c48}
.lvl:hover{background:#22679b}
.lvl:active{transform:translateY(2px);box-shadow:0 1px 0 #0b2c48}
.lvl .num{color:var(--gold);font-weight:700;font-size:13px}
.lvl .nm{font-weight:700;font-size:13px;letter-spacing:.03em;min-width:0}
.lvl small{display:block;font-weight:400;font-size:9px;color:var(--dim);margin-top:3px;letter-spacing:.05em}
.lvl .pb{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.lvl .pb small{text-align:right}
.p1{color:var(--gold)} .p2{color:var(--silver)} .p3{color:var(--bronze)} .px{color:var(--dim)}
.row{display:flex;gap:8px}
.row>*{flex:1}
button.cta{display:block;width:100%;font:700 15px var(--font);letter-spacing:.06em;color:#fff;background:var(--orange);border:0;padding:12px 10px;cursor:pointer;
  box-shadow:0 5px 0 var(--orange-dk),0 0 0 2px var(--ink)}
button.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-dk),0 0 0 2px var(--ink)}
button.ghost{font:700 11px var(--font);letter-spacing:.06em;color:var(--text);background:transparent;border:0;padding:10px 8px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
button.ghost:hover{background:rgba(111,212,228,.12)}
.note{margin-top:12px;font-size:9px;color:var(--dim);letter-spacing:.06em;text-align:center;min-height:10px}
.how{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px;font-size:10.5px;line-height:1.4;letter-spacing:.03em}
.how b{color:var(--gold);font-weight:700;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:11px;margin:4px 0 14px;letter-spacing:.03em}
th{text-align:left;font-weight:400;font-size:9px;color:var(--dim);padding:0 4px 4px}
td{padding:5px 4px;border-bottom:2px solid rgba(111,212,228,.18);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.me td{color:var(--orange);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat{background:rgba(8,26,44,.5);padding:8px 6px;text-align:center}
.stat b{display:block;font-size:16px;color:var(--text)}
.stat span{font-size:8px;color:var(--dim);letter-spacing:.06em}
.lb{margin:0 0 14px}
.lb h3{margin:12px 0 4px;font-size:12px;color:var(--gold);letter-spacing:.05em}
.lb h3 small{color:var(--dim);font-weight:400;margin-left:6px}
.empty{font-size:10px;color:var(--dim);padding:4px 0 2px}
@media (max-width:420px){ h1{font-size:30px} #cd{font-size:60px} #spd{font-size:30px} }
@media (prefers-reduced-motion:reduce){ #toast,#banner{transition:none} #ctrlBar.warn{animation:none} }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="touch"></div>

  <div id="hud" hidden>
    <div id="tl" class="panel"><div id="pos" class="big">1ST<small>/5</small></div><div id="sec" class="dim">UPWIND</div><div id="clock">0:00.0</div></div>
    <div id="tr"><canvas id="mini" width="40" height="48"></canvas><div id="windTxt" class="panel"><div id="windKn">WIND 18 KN</div><div id="shiftTxt"></div></div></div>
    <div id="tc"><button id="pauseBtn" class="chip" type="button">PAUSE</button><button id="snd" class="chip" type="button">SOUND ON</button></div>

function buildCourse(L){
  const s=L.mirror?-1:1,finishY=SHORE-70,m1y=finishY-L.legs*L.dy,m1x=-s*220;
  const marks=[{x:m1x,y:m1y,kind:'wind'}];
  for(let k=1;k<L.legs;k++)marks.push({x:(k%2)*s*L.dx,y:m1y+k*L.dy,kind:'gybe'});
  marks.push({x:(L.legs%2)*s*L.dx,y:finishY,kind:'finish',half:64});
  const start={x:m1x,y:m1y+L.up,half:115};
  for(let i=0;i<marks.length-1;i++){
    const a=i?marks[i-1]:start,m=marks[i],n=marks[i+1];
    const hin=Math.atan2(m.x-a.x,-(m.y-a.y))/D2R,hout=Math.atan2(n.x-m.x,-(n.y-m.y))/D2R;
    m.turn=wrap(hout-hin)>=0?1:-1;
  }
  let xs=marks.map(m=>m.x).concat([start.x-start.half,start.x+start.half]);
  const bx1=Math.min(...xs)-380,bx2=Math.max(...xs)+380;
  return{s,marks,start,finishY,m1y,finish:marks[marks.length-1],bx1,bx2,by1:m1y-400,by2:SHORE-12};
}
function buildIslands(L,C){
  const s=C.s,R=rng(L.seed+9);
  const raw=[[s*(L.dx+360),C.m1y+L.dy*1.3,80,56],[-s*580,C.m1y+L.up*.45,70,52],[s*120,C.m1y-280,96,44],[-s*540,C.finishY-260,58,40],[s*(L.dx+430),C.finishY-130,64,44]];
  return raw.map(([x,y,rx,ry])=>{const trees=[];if(L.tree){const n=L.isl==='green'?3:1;for(let i=0;i<n;i++)trees.push([(R()-.5)*rx*.6,(R()-.5)*ry*.5]);}return{x,y,rx,ry,trees};});
}
function buildScenery(L,C){
  const items=[],R=rng(L.seed),fx=C.finish.x,x1=C.bx1-260,x2=C.bx2+260,tbl=DECOR[L.decor];
  for(const [k,dx] of L.sig)items.push({k,x:fx+dx,y:SHORE+(k.startsWith('tuft')||k.startsWith('bush')?3:1)});
  for(let x=x1;x<=x2;x+=34+R()*22){
    if(L.sig.some(([,dx])=>Math.abs(fx+dx-x)<30))continue;
    let r=R(),acc=0,kind=null;for(const [k,w] of tbl){acc+=w;if(r<acc){kind=k;break;}}
    if(kind)items.push({k:kind,x:x+R()*10,y:SHORE+(kind.startsWith('bush')||kind.startsWith('tuft')?3:kind.startsWith('rock')?2:1)});
  }
  return items;
}

/* ================= wind & gusts ================= */
const Wd={dir:0,base:1};
let AX=0,AY=1,BX=0,BY=1,SWELL_T=0,T=0;
function setWind(){
  Wd.dir=LV.dir+LV.shift*(.65*Math.sin(T*LV.shiftF[0]+1)+.35*Math.sin(T*LV.shiftF[1]+2));
  Wd.base=1+.06*Math.sin(T*.17)+.04*Math.sin(T*.41+1);
  const r=Wd.dir*D2R;AX=-Math.sin(r);AY=Math.cos(r);
  BX=AX;BY=AY;SWELL_T=T*12;
}
const patches=[];
function spawnPatch(px,py,initial){
  const lull=Math.random()<LV.lullP;
  const rl=rnd(80,140),rw=rnd(38,64),life=rnd(20,34);
  const along=initial?rnd(-380,380):-rnd(300,400),across=rnd(-300,300);
  patches.push({x:px+AX*along-AY*across,y:py+AY*along+AX*across,
    amp:lull?-rnd(LV.lullA[0],LV.lullA[1]):rnd(LV.gustA[0],LV.gustA[1]),rl,rw,irl2:1/(rl*rl),irw2:1/(rw*rw),
    age:initial?rnd(0,life*.7):0,life,sp:rnd(.6,.85),env:0});
}
function updatePatches(dt,px,py){
  for(let i=patches.length-1;i>=0;i--){
    const p=patches[i];p.age+=dt;p.x+=AX*24*p.sp*dt;p.y+=AY*24*p.sp*dt;
    p.env=Math.max(0,Math.min(1,p.age/4,(p.life-p.age)/4));
    if(p.age>p.life||Math.hypot(p.x-px,p.y-py)>620)patches.splice(i,1);
  }
  while(patches.length<LV.gustN)spawnPatch(px,py,false);
}
function gustAt(x,y){
  let g=0;
  for(let i=0;i<patches.length;i++){const p=patches[i],dx=x-p.x,dy=y-p.y,al=dx*AX+dy*AY,ac=-dx*AY+dy*AX,d2=al*al*p.irl2+ac*ac*p.irw2;if(d2<1)g+=p.amp*p.env*(1-d2);}
  return clamp(g,-.7,.9);
}

/* ================= polar: speed fraction vs true wind angle ================= */
const POL=[[0,0],[36,0],[42,.36],[48,.52],[55,.6],[70,.72],[90,.86],[110,.95],[130,1],[145,.95],[155,.86],[165,.66],[172,.5],[180,.42]];
function polar(twa){
  for(let i=1;i<POL.length;i++)if(twa<=POL[i][0]){const a=POL[i-1],b=POL[i],t=(twa-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],t*t*(3-2*t)*.5+t*.5);}
  return .42;
}
const vmaxOf=kn=>35*Math.pow(Math.max(kn,1)/20,.55);
function bestTwaTo(x,y,tx,ty){
  const brg=Math.atan2(tx-x,-(ty-y))/D2R;let best=-1,bt=130;
  for(let t=38;t<=180;t+=2)for(let k=-1;k<=1;k+=2){const d=Math.abs(wrap(Wd.dir+k*t-brg));if(d>100)continue;const sc=polar(t)*Math.cos(d*D2R);if(sc>best){best=sc;bt=t;}}
  return bt;
}
let UPT=50;
function bestHeading(b){
  const m=C.marks[b.next];if(!m)return{psi:b.psi,twa:b.twa};
  const tx=m.x,ty=m.kind==='finish'?m.y+20:m.y,brg=Math.atan2(tx-b.x,-(ty-b.y))/D2R;
  const bs=[-9,-9],bp=[0,0],bt=[0,0];
  for(let si=0;si<2;si++){const k=si?1:-1;for(let t=38;t<=180;t+=2){const psi=Wd.dir+k*t,d=Math.abs(wrap(psi-brg));if(d>100)continue;const sc=polar(t)*Math.cos(d*D2R);if(sc>bs[si]){bs[si]=sc;bp[si]=psi;bt[si]=t;}}}
  const cur=b.rel>=0?0:1,si=bs[cur]>=Math.max(bs[0],bs[1])*.85?cur:1-cur;
  return{psi:bp[si],twa:bt[si]};
}
function upwindTwa(){let best=-1,bt=50;for(let t=38;t<=80;t++){const sc=polar(t)*Math.cos(t*D2R);if(sc>best){best=sc;bt=t;}}return bt;}

      si:1,tPlan:0,tgt:psi0,err:0,tErr:0,tSw:0,crest:0,rel:-48,twa:48,f:0,flow:0,ctrl:1,ratio:0,

const parts=[];
function emit(x,y,z,vx,vy,vz,life,k){if(parts.length<650)parts.push({x,y,z,vx,vy,vz,life,max:life,k});}

function stepBoat(b,dt,steer){
  const L=LV,g=gustAt(b.x,b.y);
  const wl=clamp(Wd.base*(1+g*.55),.35,1.8);
  b.wl+=(wl-b.wl)*Math.min(1,dt*4);
  const dg=b.wl-b.wls;b.wls+=(b.wl-b.wls)*Math.min(1,dt*.8);
  const prevRel=b.rel;
  let rel=wrap(Wd.dir-b.psi),twa=Math.abs(rel);
  const kn=L.kn*b.wl,vmax=vmaxOf(kn),plan=.42+.58*smooth(10,15,kn);
  b.f=polar(twa);
  if(b.flipT>0)b.flipT-=dt;
  if(b.boostT>0)b.boostT-=dt;
  if(b.easeT>0)b.easeT-=dt;
  const crashed=b.crashT>0;
  if(crashed){b.crashT-=dt;if(b.crashT<=0){b.crashT=0;b.v=3;b.ctrl=1;}}
  let target=0;
  if(go&&b.fin==null&&!crashed&&b.flipT<=0)target=b.f*vmax*plan*b.eff*(1+.1*b.flow)*(b.boostT>0?1.06:1)*(b.easeT>0?.9:1);
  let acc;
  if(target>b.v)acc=b.v<PLANE_V?2.6+2.4*(b.v/PLANE_V):6+2*clamp(g,0,1);
  else acc=crashed?14:b.flipT>0?4.5:twa<38?7:twa>150?5.5:3.2;
  if(b.fin!=null)acc=2.5;
  b.v+=clamp(target-b.v,-acc*dt,acc*dt);
  if(b.v<0)b.v=0;

  /* steering: carving has a grip limit, too tight = skid */
  const vp=b.v*KN2PX,mv=clamp(b.v/8,0,1),turnMax=70+80*clamp(b.v/30,0,1);
  let cmd=crashed?0:steer*turnMax;
  b.skidNow=0;
  if(b.v>14){
    const Rmin=16+.9*b.v,grip=(vp/Rmin)/D2R;
    if(Math.abs(cmd)>grip){const over=Math.abs(cmd)/grip-1;b.skidNow=over;cmd=Math.sign(cmd)*grip*(1+.35*over);b.v=Math.max(0,b.v-16*over*dt);
      if(Math.random()<over*2)emit(b.x+rnd(-3,3),b.y+rnd(-3,3),1,rnd(-20,20),rnd(-20,20),rnd(20,40),.5,1);}
  }
  b.yaw+=(cmd-b.yaw)*Math.min(1,dt*7);
  const k=b.ai?.5:1,ch=L.chop;
  const chop=crashed?0:(Math.sin(T*1.7+b.ph)+.7*Math.sin(T*3.3+b.ph*2.1)+.5*Math.sin(T*.7+b.ph*3.3))*(3+5*ch)*(.5+.6*b.wl)*mv;
  const gy=crashed?0:(rel>=0?1:-1)*clamp(dg,-.5,.5)*40*mv;
  b.psi=(b.psi+(b.yaw+(chop+gy)*k)*dt+360)%360;
  rel=wrap(Wd.dir-b.psi);twa=Math.abs(rel);b.rel=rel;b.twa=twa;

  /* sail flip: gybe (through downwind) or tack (through the wind) */
  if(!crashed&&(rel>=0)!==(prevRel>=0)){
    if(twa>90){b.flipT=.42;if(b.gy)b.gy.flip=true;b.gybes++;}
    else{b.flipT=.55;b.gy=null;onTack(b);}
  }

  /* grip: blasting over the top of a gust on chop drains it */
  const topBase=vmaxOf(L.kn*Wd.base);
  const ratio=b.v/topBase;b.ratio=ratio;
  const s=b.x*AX+b.y*AY-SWELL_T,ci=Math.floor(s/46);
  let bump=false;
  if(ci!==b.crest){b.crest=ci;if(b.v>4&&!crashed){b.psi=(b.psi+rnd(-1,1)*(1.2+2.6*ch)*(.6+b.wl)*k+360)%360;bump=true;}}
  if(!crashed&&go&&b.fin==null){
    /* locked on the power angle while overpowered drains grip; a few degrees off spills power */
    const off=b.ai?0:Math.abs(b.twa-b.aim),lock=clamp(1-off/10,0,1);
    if(ratio>1.06&&b.v>22&&lock>0)b.ctrl-=(.14+2*(ratio-1.06))*(.55+.75*ch)*lock*dt+(bump&&off<5?.025+.045*ch:0);
    else if(ratio<1.04||off>8)b.ctrl=Math.min(1,b.ctrl+.3*dt);
    if(b.ai&&b.ctrl<.5)b.easeT=1.6;
    if(!b.ai&&!demo&&b.ctrl<.5)toastOnce('EASE OFF · STEER A FEW DEGREES OFF','#ff5a5a');
    if(b.ctrl<=0)crash(b);
  }

  /* move */
  const q=b.psi*D2R,fx=Math.sin(q),fy=-Math.cos(q),spx=b.v*KN2PX;
  b.x+=fx*spx*dt;b.y+=fy*spx*dt;
  if(b.y>C.by2){b.y=C.by2;b.v*=.9;}
  if(b.y<C.by1){b.y=C.by1;b.v*=.96;}
  if(b.x<C.bx1){b.x=C.bx1;b.v*=.96;}
  if(b.x>C.bx2){b.x=C.bx2;b.v*=.96;}
  for(const is of ISL){const nx=(b.x-is.x)/is.rx,ny=(b.y-is.y)/is.ry,d=Math.hypot(nx,ny);if(d<1.1){const m=d||.01;b.x=is.x+nx/m*1.1*is.rx;b.y=is.y+ny/m*1.1*is.ry;b.v*=.92;}}

  gybeTrack(b,dt);
  if(!b.ai&&go&&b.fin==null){
    if(crashed)b.flow=0;
    else{b.aimT-=dt;if(b.aimT<=0){b.aimT=.2;const bh=bestHeading(b);b.aim=bh.twa;}
      const off=Math.abs(b.twa-b.aim);
      if(b.v>PLANE_V&&off<6)b.flow=Math.min(1,b.flow+.09*dt);
      else if(off>14||b.v<PLANE_V)b.flow=Math.max(0,b.flow-.06*dt);}
  }
  if(b.v>b.topSpd&&go)b.topSpd=b.v;

  /* wake & spray */
  if(!crashed&&b.v>5){
    b.foamT-=dt;if(b.foamT<=0){b.foamT=.06;emit(b.x-fx*7,b.y-fy*7,0,0,0,0,1.3+b.v*.02,0);}
    b.trail+=dt*b.v*(b.v>PLANE_V?1.6:.5);
    while(b.trail>1){b.trail--;const sd=Math.random()<.5?-1:1,rxv=Math.cos(q),ryv=Math.sin(q);
      emit(b.x-fx*6+rxv*sd*2,b.y-fy*6+ryv*sd*2,1,-fx*10+rxv*sd*rnd(6,16),-fy*10+ryv*sd*rnd(6,16),rnd(14,32),rnd(.3,.6),1);}
  }
}

function gybeTrack(b,dt){
  if(b.crashT>0||b.fin!=null){b.gy=null;return;}
  const down=-Math.sign(b.rel)*b.yaw;
  if(!b.gy){
    if(b.v>PLANE_V&&b.twa>105&&b.twa<172&&down>30)b.gy={vIn:b.v,t:0,flip:false,skid:0,rSum:0,rT:0};
    return;
  }
  const G=b.gy;G.t+=dt;G.skid+=b.skidNow*dt;
  const yr=Math.abs(b.yaw)*D2R;if(yr>.2){G.rSum+=b.v*KN2PX/yr*dt;G.rT+=dt;}
  if(!G.flip){if(G.t>3.5||b.twa<95)b.gy=null;return;}
  if(b.twa<150||G.t>5){
    const ret=b.v/Math.max(1,G.vIn),avgR=G.rT>0?G.rSum/G.rT:999,dv=b.v-G.vIn;
    let r;
    if(G.skid>.06)r='tight';
    else if(avgR>100)r='wide';
    else if(ret>=.87)r='perfect';
    else if(ret>=.74)r='good';
    else r='slow';
    if(r==='perfect'){b.flow=Math.min(1,b.flow+.3);b.v+=2.5;b.boostT=2.5;b.pg++;}
    else if(r==='good')b.flow=Math.min(1,b.flow+.1);
    else b.flow=Math.max(0,b.flow-(r==='tight'?.3:.2));
    b.lastGybe={r,ret,avgR,dv,skid:G.skid};
    if(!b.ai&&!demo)gybeFeedback(r,dv+(r==='perfect'?2.5:0),avgR);
    b.gy=null;
  }
}
function onTack(b){
  if(b.ai||demo)return;
  b.flow=Math.max(0,b.flow-.1);
  toast('TACK','#9fd2e2');
}
function crash(b){
  b.crashT=2.2;b.ctrl=1;b.flow=0;b.crashes++;b.gy=null;b.boostT=0;
  const q=b.psi*D2R;

/* ================= AI ================= */
function aiHeading(b){
  const m=C.marks[b.next];if(!m)return b.psi;
  const tx=m.x,ty=m.kind==='finish'?m.y+20:m.y;
  const dx=tx-b.x,dy=ty-b.y,dist=Math.hypot(dx,dy),brg=Math.atan2(dx,-dy)/D2R;
  const bestS=[-9,-9],bestP=[0,0];
  for(let si=0;si<2;si++){const k=si?1:-1;for(let t=40;t<=180;t+=3){const psi=Wd.dir+k*t,d=Math.abs(wrap(psi-brg));if(d>100)continue;const sc=polar(t)*Math.cos(d*D2R);if(sc>bestS[si]){bestS[si]=sc;bestP[si]=psi;}}}
  let si=b.si;
  if(b.tSw>0)b.tSw-=.3;
  const P0=b.prev;let lx=m.x-P0.x,ly=m.y-P0.y;const ll=Math.hypot(lx,ly)||1;lx/=ll;ly/=ll;
  const cross=(b.x-P0.x)*ly-(b.y-P0.y)*lx;
  const pr=bestP[si]*D2R,lat=Math.sin(pr)*ly+Math.cos(pr)*lx;
  const corr=140+ll*.05;
  if(bestS[1-si]>bestS[si]*1.2+.03||(b.tSw<=0&&((Math.abs(cross)>corr&&Math.sign(lat)===Math.sign(cross)&&bestS[1-si]>.05)||bestS[si]<.03))){si=1-si;b.si=si;b.tSw=4;}
  let h=bestP[si];
  if(dist<60){const dd=Math.abs(wrap(Wd.dir-brg));if(polar(dd)>.3)h=brg;}
  return h;
}
function aiSteer(b,dt){
  b.tPlan-=dt;b.tErr-=dt;
  if(b.tErr<=0){b.err=rnd(-6,6);b.tErr=rnd(2,5);}
  if(b.tPlan<=0){b.tPlan=.25;b.tgt=aiHeading(b);}
  return clamp(wrap(b.tgt+b.err-b.psi)/16,-1,1)*b.carve;
}
function progress(b){
  if(b.fin!=null)return 1e7-b.fin;
  const m=C.marks[b.next];return b.next*10000-Math.hypot(m.x-b.x,m.y-b.y);
}
const ranked=()=>boats.slice().sort((a,b)=>progress(b)-progress(a));

function finish(b){
  b.fin=raceT;b.place=boats.filter(x=>x.fin!=null).length;
  if(!b.ai&&!demo){state='done';doneT=0;toast('FINISHED · '+ORD[b.place-1],'#ffd23f',3);chime(true);recordRun(b);}
}
function checkMarks(b){
  if(b.fin!=null)return;
  const m=C.marks[b.next];
  if(m.kind==='finish'){
    if(b.y>=C.finishY){if(Math.abs(b.x-m.x)<=m.half)finish(b);else if(!b.ai&&!demo)toastOnce('MISSED THE FINISH GATE','#ff5a5a');}
    return;

async function initDb(){

    const id=await u.id();if(!id)return;
    db=d;uid=id;dbState='loading';refreshMenu();
    const timer=setTimeout(()=>{if(dbState==='loading'){dbState='slow';refreshMenu();}},10000);
    db.collection('data/users/'+uid).onSnapshot(snap=>{

      for(const doc of snap.docs){if(!LEVELS.some(l=>l.id===doc.id))continue;const v=doc.data();if(v&&Array.isArray(v.runs))mergeRuns(doc.id,v.runs);}

}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dstr=at=>{try{return new Date(at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase();}catch(_){return '';}};
function homeHTML(){
  let h='<h1>TINY<br>WINDSURF</h1><p class="sub">PWA TOUR · 5 SPOTS · UPWIND + SLALOM</p><div class="levels">';
  LEVELS.forEach((L,i)=>{const b=bestOf(L.id);
    h+='<button class="lvl" type="button" data-act="play" data-i="'+i+'"><span class="num">0'+(i+1)+'</span><span class="nm">'+L.spot+'<small>'+L.where+' · '+L.kn+' KN · '+L.tag+'</small></span>'+
      '<span class="pb">'+(b?'<span class="'+pcls(b.place)+'">'+fmt(b.t)+'</span><small>'+ORD[b.place-1]+' BEST</small>':'<small>NO TIME</small>')+'</span></button>';});
  h+='</div><div class="row"><button class="ghost" type="button" data-act="how">HOW TO RIDE</button><button class="ghost" type="button" data-act="board">MY TIMES</button></div><div class="note">'+saveNote()+'</div>';
  return h;
}
function howHTML(){
  return '<h2>HOW TO RIDE</h2><p class="sub">WIND BLOWS FROM THE TOP OF THE MAP</p><ul class="how">'+
  '<li><b>STEER</b>HOLD LEFT OR RIGHT. THE FURTHER FROM THE MIDDLE YOU PRESS, THE HARDER YOU CARVE. KEYS: ARROWS OR A / D, HOLD LONGER TO CARVE HARDER, SHIFT FOR FULL LOCK.</li>'+
  '<li><b>UPWIND</b>YOU CAN\'T SAIL STRAIGHT INTO THE WIND. ZIG-ZAG AT ABOUT 50° (THE GOLD TICK ON THE GAUGE). DOTTED GOLD LINES ARE THE LAYLINES. LIFT = KEEP GOING, HEADER = TACK.</li>'+
  '<li><b>SLALOM</b>BROAD REACH IS FULL SPEED. GYBE AROUND EACH MARK: START THE CARVE BEFORE THE BUOY. TOO TIGHT SPINS OUT, TOO WIDE DROPS OFF THE PLANE. A PERFECT GYBE PUMPS YOU OUT FASTER.</li>'+
  '<li><b>GUSTS</b>DARK RIPPLED WATER = MORE WIND. PALE GLASSY WATER = LULL. THEY DRIFT DOWNWIND, SO STEER INTO THEM.</li>'+
  '<li><b>FLOW</b>HOLD THE BEST ANGLE AND FLOW BUILDS: UP TO +10% TOP SPEED. TACKS, BAD GYBES AND CRASHES BURN IT.</li>'+
  '<li><b>GRIP</b>OVERPOWERED IN A GUST ON CHOP? GRIP DRAINS. EASE OFF THE ANGLE A FEW DEGREES BEFORE IT EMPTIES OR YOU CATAPULT.</li></ul>'+
  '<button class="cta" type="button" data-act="home">BACK</button>';
}
function boardHTML(){
  let h='<h2>MY TIMES</h2><p class="sub">PERSONAL BESTS AND RECENT RACES</p><div class="lb">';
  LEVELS.forEach((L,i)=>{const runs=((records[L.id]&&records[L.id].runs)||[]).slice().sort((a,b)=>a.t-b.t).slice(0,5);
    h+='<h3>0'+(i+1)+' '+L.spot+'<small>'+(((records[L.id]&&records[L.id].runs)||[]).length)+' RACES</small></h3>';
    if(!runs.length)h+='<div class="empty">NO FINISHES YET</div>';
    else{h+='<table><tr><th>#</th><th>TIME</th><th>PLACE</th><th>TOP</th><th class="r">DATE</th></tr>';
      runs.forEach((r,k)=>{h+='<tr><td>'+(k+1)+'</td><td class="'+(k===0?'p1':'')+'">'+fmt(r.t)+'</td><td class="'+pcls(r.place)+'">'+ORD[r.place-1]+'</td><td>'+r.top.toFixed(1)+'</td><td class="r">'+dstr(r.at)+'</td></tr>';});
      h+='</table>';}});
  h+='</div><button class="cta" type="button" data-act="home">BACK</button><div class="note">'+saveNote()+'</div>';
  return h;
}
function resultsHTML(){
  const p=boats[0],lr=lastRun,order=boats.slice().sort((a,b)=>(a.fin!=null?a.fin:1e9-progress(a)/1e4)-(b.fin!=null?b.fin:1e9-progress(b)/1e4));
  let h='<h2>'+(p.place===1?'WINNER!':ORD[p.place-1]+' PLACE')+'</h2><p class="sub">'+LV.spot+' · '+fmt(p.fin)+(lr&&lr.pb?' · NEW BEST TIME':'')+'</p>';
  h+='<div class="stats"><div class="stat"><b>'+p.topSpd.toFixed(1)+'</b><span>TOP KN</span></div><div class="stat"><b>'+p.pg+'/'+Math.max(p.gybes,0)+'</b><span>PERFECT GYBES</span></div><div class="stat"><b>'+p.crashes+'</b><span>CATAPULTS</span></div></div>';
  h+='<table><tr><th>POS</th><th>RIDER</th><th class="r">TIME</th></tr>';
  order.forEach((b,i)=>{h+='<tr'+(b.ai?'':' class="me"')+'><td class="'+pcls(i+1)+'">'+ORD[i]+'</td><td>'+b.name+'</td><td class="r">'+(b.fin!=null?fmt(b.fin):'RACING')+'</td></tr>';});
  h+='</table><div class="row" style="margin-bottom:10px"><button class="cta" type="button" data-act="retry">RETRY</button>'+(LI<LEVELS.length-1?'<button class="cta" type="button" data-act="next">NEXT SPOT</button>':'')+'</div>'+
     '<div class="row"><button class="ghost" type="button" data-act="board">MY TIMES</button><button class="ghost" type="button" data-act="home">MENU</button></div>';
  return h;
}
function pauseHTML(){return '<h2>PAUSED</h2><p class="sub">'+LV.spot+'</p><div class="row" style="margin-bottom:10px"><button class="cta" type="button" data-act="resume">RESUME</button></div><div class="row"><button class="ghost" type="button" data-act="retry">RESTART</button><button class="ghost" type="button" data-act="home">QUIT</button></div>';}
function show(scr){
  screen=scr;
  card.innerHTML=scr==='home'?homeHTML():scr==='how'?howHTML():scr==='board'?boardHTML():scr==='results'?resultsHTML():pauseHTML();
  overlay.hidden=false;overlay.scrollTop=0;
}
function refreshMenu(){if(!overlay.hidden&&(screen==='home'||screen==='board'))show(screen);}
overlay.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  initAudio();
  const a=t.dataset.act;
  if(a==='play')startRace(+t.dataset.i);
  else if(a==='retry')startRace(LI);
  else if(a==='next')startRace(Math.min(LEVELS.length-1,LI+1));
  else if(a==='resume')togglePause();
  else if(a==='home'){if(screen==='results'||screen==='pause'){paused=false;startDemo(LI);}show('home');}
  else show(a);
});
$('pauseBtn').addEventListener('click',()=>togglePause());
function togglePause(){
  if(state!=='race'&&state!=='count'&&!paused)return;
  paused=!paused;
  if(paused){ptrs.clear();show('pause');}else{overlay.hidden=true;}
}

/* ================= race flow ================= */
function startRace(i){
  demo=false;paused=false;loadLevel(i);setupBoats(false);
  state='count';go=false;cdT=3.2;lastCd=4;raceT=0;doneT=0;lastRun=null;
  const p=boats[0];cam.x=p.x;cam.y=p.y-30;
  overlay.hidden=true;$('hud').hidden=false;$('cd').textContent='';
  banner(LV.spot,'UPWIND FIRST · PLAY THE SHIFTS');
}
function startDemo(i){
  demo=true;loadLevel(i);setupBoats(true);state='menu';go=true;raceT=0;doneT=0;
  $('hud').hidden=true;$('cd').textContent='';
  const b=boats[1];cam.x=b.x;cam.y=b.y;
}

function update(dt){
  T+=dt;setWind();
  if(toastT>0){toastT-=dt;if(toastT<=0){toastEl.classList.remove('on');toastKey='';}}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on');}
  if(deltaT>0){deltaT-=dt;if(deltaT<=0)$('delta').textContent='';}
  const lead=demo?ranked()[0]:boats[0];
  updatePatches(dt,lead.x,lead.y);

  if(state==='count'){
    cdT-=dt;const n=Math.ceil(cdT);
    if(n!==lastCd&&n>=1){lastCd=n;$('cd').textContent=n;beep(520,.1);}
    if(cdT<=0){state='race';go=true;raceT=0;$('cd').textContent='GO!';beep(1040,.35,'square',.07);setTimeout(()=>{if(state!=='count')$('cd').textContent='';},800);}
  }
  if(state==='race'||state==='done'||state==='menu'||state==='results')raceT+=dt;

  steerIn=steerHook?steerHook(boats[0],dt):readSteer(dt);
  const pr=progress(boats[0]);
  for(const b of boats){
    let s=0;
    if(!b.ai)s=(b.fin==null&&state==='race')?steerIn:0;
    else if(b.fin==null&&go){
      s=aiSteer(b,dt);
      if(!demo){const gap=progress(b)-pr;b.eff=clamp(b.eff+(gap>250?-.003:gap<-300?.003:0)*dt*8,LV.ai[0]-.03,LV.ai[1]+.03);}
    }
    stepBoat(b,dt,s);
    if(go)checkMarks(b);
  }
  for(let i=0;i<boats.length;i++)for(let j=i+1;j<boats.length;j++){
    const a=boats[i],c=boats[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
    if(d<11&&d>.01){const o=(11-d)/2/d;a.x-=dx*o;a.y-=dy*o;c.x+=dx*o;c.y+=dy*o;}
  }
  if(state==='done'){doneT+=dt;if(doneT>4.5||boats.every(b=>b.fin!=null)){state='results';show('results');}}
  if(state==='menu'){if(boats.some(b=>b.fin!=null)){doneT+=dt;if(doneT>4)startDemo((LI+1)%LEVELS.length);}}

  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.k===1){q.z+=q.vz*dt;q.vz-=90*dt;if(q.z<0)q.life=0;}
    if(q.life<=0){parts[i]=parts[parts.length-1];parts.pop();}}

  const f=demo?ranked()[0]:boats[0];
  const q=f.psi*D2R,la=clamp(f.v*KN2PX*.7,0,.32*Math.min(W,H));
  let tx=f.x+Math.sin(q)*la,ty=f.y-Math.cos(q)*la;
  if(state==='count'){tx=f.x;ty=f.y-30;}
  const k=Math.min(1,dt*3.2);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.y=Math.min(cam.y,SHORE+40-H/2);
}

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;
  try{
    if(!paused)update(dt);
    render();
    if(!demo&&!paused)updateHUD(dt);
  }catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
try{
  buildSprites();
  resize();
  startDemo(0);
  show('home');
}catch(e){window.__twFail((e&&e.message)||String(e));return;}
initDb();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
